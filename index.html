<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geographie Quiz - Lernen & Spielen</title>
    <meta name="description" content="Interaktives Geographie-Quiz: Lerne Länder, Hauptstädte, Flaggen, Flüsse und Gebirge auf einer Weltkarte.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
        <div class="loader"></div>
        <div class="loading-text">Karte wird geladen...</div>
        <div class="loading-sub" id="loadingStatus">Initialisierung...</div>
        <div class="loading-progress">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <button class="action-btn secondary loading-retry" id="retryLoadBtn" type="button">Erneut versuchen</button>
    </div>

    <div id="map"></div>

    <!-- Question Panel -->
    <div class="panel question-panel">
        <div class="q-header">
            <span class="q-badge" id="qBadge">Bereit</span>
            <span class="q-mode" id="qMode"></span>
        </div>
        <div class="q-text" id="qText">Wähle Quiz oder Lernmodus!</div>
        <div class="hint-box" id="hintBox"></div>
        <div class="mnemonic-box" id="mnemonicBox">
            <div class="mnemonic-title">💡 Merkhilfe</div>
            <div class="mnemonic-text" id="mnemonicText"></div>
        </div>
    </div>

    <!-- Stats -->
    <div class="panel stats-panel">
        <div class="stats-title">Statistik</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-val blue" id="statScore">0</div>
                <div class="stat-lbl">Punkte</div>
            </div>
            <div class="stat-box">
                <div class="stat-val gold" id="statStreak">0</div>
                <div class="stat-lbl">Serie</div>
            </div>
            <div class="stat-box">
                <div class="stat-val green" id="statCorrect">0</div>
                <div class="stat-lbl">Richtig</div>
            </div>
            <div class="stat-box">
                <div class="stat-val red" id="statWrong">0</div>
                <div class="stat-lbl">Falsch</div>
            </div>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-txt" id="progressTxt">0 / 10</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="panel controls-panel">
        <button class="ctrl-btn" data-action="zoom-in" type="button" aria-label="Hineinzoomen">+</button>
        <button class="ctrl-btn" data-action="zoom-out" type="button" aria-label="Herauszoomen">−</button>
        <button class="ctrl-btn" data-action="reset-view" type="button" aria-label="Ansicht zurücksetzen">🏠</button>
        <button class="ctrl-btn active" id="toggleRivers" data-action="toggle-rivers" type="button" aria-label="Flüsse ein-/ausblenden" aria-pressed="true">🌊</button>
        <button class="ctrl-btn active" id="toggleMountains" data-action="toggle-mountains" type="button" aria-label="Gebirge ein-/ausblenden" aria-pressed="true">⛰️</button>
    </div>

    <!-- Mode Panel -->
    <div class="panel mode-panel" id="modePanel">
        <button class="mode-header" id="modeHeader" type="button" aria-expanded="true">
            <h3>🎮 Einstellungen</h3>
            <span class="collapse-btn" id="collapseBtn" aria-hidden="true">▼</span>
        </button>
        <div class="mode-body">
            <div class="mode-tabs" role="tablist" aria-label="Modus">
                <button class="mode-tab active" id="tabQuiz" data-tab="quiz" type="button" role="tab" aria-selected="true">🎯 Quiz</button>
                <button class="mode-tab" id="tabLearn" data-tab="learn" type="button" role="tab" aria-selected="false">📚 Lernen</button>
            </div>
            <div class="mode-grid">
                <button class="mode-btn active" data-mode="countries" type="button">
                    <div class="icon">🗺️</div><div class="label">Länder</div>
                </button>
                <button class="mode-btn" data-mode="capitals" type="button">
                    <div class="icon">🏛️</div><div class="label">Hauptstädte</div>
                </button>
                <button class="mode-btn" data-mode="flags" type="button">
                    <div class="icon">🚩</div><div class="label">Flaggen</div>
                </button>
                <button class="mode-btn" data-mode="rivers" type="button">
                    <div class="icon">🌊</div><div class="label">Flüsse</div>
                </button>
                <button class="mode-btn" data-mode="mountains" type="button">
                    <div class="icon">⛰️</div><div class="label">Gebirge</div>
                </button>
                <button class="mode-btn" data-mode="mixed" type="button">
                    <div class="icon">🎲</div><div class="label">Gemischt</div>
                </button>
            </div>
            <select class="region-select" id="regionSelect">
                <option value="world">🌍 Ganze Welt</option>
                <option value="europe">🇪🇺 Europa</option>
                <option value="asia">🌏 Asien</option>
                <option value="africa">🌍 Afrika</option>
                <option value="northAmerica">🌎 Nordamerika</option>
                <option value="southAmerica">🌎 Südamerika</option>
                <option value="oceania">🏝️ Ozeanien</option>
            </select>
            <div class="learn-options hidden" id="learnOptions">
                <label class="learn-option">
                    <input type="checkbox" id="optShowMnemonic" checked> Merkhilfen anzeigen
                </label>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="panel action-panel">
        <button class="action-btn secondary" data-action="hint" id="hintBtn" type="button" disabled>💡 Tipp</button>
        <button class="action-btn secondary" data-action="skip" id="skipBtn" type="button" disabled>⏭️ Skip</button>
        <button class="action-btn primary" data-action="start" id="startBtn" type="button">🎯 Quiz</button>
        <button class="action-btn learn hidden" data-action="learn" id="learnBtn" type="button">📚 Lernen</button>
    </div>

    <!-- Info Card -->
    <div class="info-card" id="infoCard">
        <div class="info-card-title" id="infoTitle">🌊 Rhein</div>
        <div class="info-card-subtitle" id="infoSubtitle">Fluss</div>
        <div class="info-card-facts" id="infoFacts"></div>
        <div class="info-mnemonic">
            <div class="info-mnemonic-title">💡 Merkhilfe</div>
            <div class="info-mnemonic-text" id="infoMnemonicText"></div>
        </div>
        <div class="info-card-nav">
            <button class="info-nav-prev" data-action="learn-prev" type="button" aria-label="Vorheriges Element">←</button>
            <button class="info-nav-close" data-action="close-info" type="button" aria-label="Schließen">OK ✓</button>
            <button class="info-nav-next" data-action="learn-next" type="button" aria-label="Nächstes Element">→</button>
        </div>
    </div>

    <!-- Feedback -->
    <div class="feedback-toast" id="feedbackToast" role="status" aria-live="polite"></div>
    <div class="streak-badge" id="streakBadge">🔥 <span id="streakNum">0</span>x</div>

    <!-- Result Popup -->
    <div class="popup-overlay" id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-popup">
            <h2 id="resultTitle">Quiz beendet!</h2>
            <div class="emoji" id="resEmoji">🎉</div>
            <div class="big-score" id="resScore">0%</div>
            <div class="msg" id="resMsg">Gut gemacht!</div>
            <div class="result-breakdown">
                <div class="bd-item"><div class="bd-val" id="resCorrect">0</div><div class="bd-lbl">Richtig</div></div>
                <div class="bd-item"><div class="bd-val" id="resWrong">0</div><div class="bd-lbl">Falsch</div></div>
                <div class="bd-item"><div class="bd-val" id="resPoints">0</div><div class="bd-lbl">Punkte</div></div>
            </div>
            <div class="weak-areas hidden" id="weakAreas">
                <div class="weak-title">📝 Wiederholen:</div>
                <div id="weakList"></div>
            </div>
            <button class="action-btn primary result-action" data-action="close-popup" type="button">🔄 Nochmal</button>
            <button class="action-btn learn result-action result-review hidden" data-action="review" id="reviewBtn" type="button">📚 Üben</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
