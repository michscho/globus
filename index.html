<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geographie Quiz - Lernen & Spielen</title>
    <meta name="description" content="Interaktives Geographie-Quiz: Lerne Länder, Hauptstädte, Flaggen, Flüsse und Gebirge auf einer Weltkarte.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
        <div class="loading-text">Karte wird geladen...</div>
        <div class="loading-sub" id="loadingStatus">Initialisierung...</div>
        <div class="loading-progress">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Question Panel -->
    <div class="panel question-panel">
        <div class="q-header">
            <span class="q-badge" id="qBadge">Bereit</span>
            <span class="q-mode" id="qMode"></span>
        </div>
        <div class="q-text" id="qText">Wähle Quiz oder Lernmodus!</div>
        <div class="hint-box" id="hintBox"></div>
        <div class="mnemonic-box" id="mnemonicBox">
            <div class="mnemonic-title">💡 Merkhilfe</div>
            <div class="mnemonic-text" id="mnemonicText"></div>
        </div>
    </div>

    <!-- Stats -->
    <div class="panel stats-panel">
        <div class="stats-title">Statistik</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-val blue" id="statScore">0</div>
                <div class="stat-lbl">Punkte</div>
            </div>
            <div class="stat-box">
                <div class="stat-val gold" id="statStreak">0</div>
                <div class="stat-lbl">Serie</div>
            </div>
            <div class="stat-box">
                <div class="stat-val green" id="statCorrect">0</div>
                <div class="stat-lbl">Richtig</div>
            </div>
            <div class="stat-box">
                <div class="stat-val red" id="statWrong">0</div>
                <div class="stat-lbl">Falsch</div>
            </div>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-txt" id="progressTxt">0 / 10</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="panel controls-panel">
        <button class="ctrl-btn" onclick="map.zoomIn()" aria-label="Hineinzoomen">+</button>
        <button class="ctrl-btn" onclick="map.zoomOut()" aria-label="Herauszoomen">−</button>
        <button class="ctrl-btn" onclick="resetView()" aria-label="Ansicht zurücksetzen">🏠</button>
        <button class="ctrl-btn active" id="toggleRivers" onclick="toggleRivers()" aria-label="Flüsse ein-/ausblenden">🌊</button>
        <button class="ctrl-btn active" id="toggleMountains" onclick="toggleMountains()" aria-label="Gebirge ein-/ausblenden">⛰️</button>
    </div>

    <!-- Mode Panel -->
    <div class="panel mode-panel" id="modePanel">
        <div class="mode-header" onclick="toggleModePanel()">
            <h3>🎮 Einstellungen</h3>
            <button class="collapse-btn" id="collapseBtn">▼</button>
        </div>
        <div class="mode-body">
            <div class="mode-tabs">
                <button class="mode-tab active" id="tabQuiz" onclick="setTab('quiz')">🎯 Quiz</button>
                <button class="mode-tab" id="tabLearn" onclick="setTab('learn')">📚 Lernen</button>
            </div>
            <div class="mode-grid">
                <button class="mode-btn active" onclick="setMode('countries', this)">
                    <div class="icon">🗺️</div><div class="label">Länder</div>
                </button>
                <button class="mode-btn" onclick="setMode('capitals', this)">
                    <div class="icon">🏛️</div><div class="label">Hauptstädte</div>
                </button>
                <button class="mode-btn" onclick="setMode('flags', this)">
                    <div class="icon">🚩</div><div class="label">Flaggen</div>
                </button>
                <button class="mode-btn" onclick="setMode('rivers', this)">
                    <div class="icon">🌊</div><div class="label">Flüsse</div>
                </button>
                <button class="mode-btn" onclick="setMode('mountains', this)">
                    <div class="icon">⛰️</div><div class="label">Gebirge</div>
                </button>
                <button class="mode-btn" onclick="setMode('mixed', this)">
                    <div class="icon">🎲</div><div class="label">Gemischt</div>
                </button>
            </div>
            <select class="region-select" id="regionSelect" onchange="setRegion(this.value)">
                <option value="world">🌍 Ganze Welt</option>
                <option value="europe">🇪🇺 Europa</option>
                <option value="asia">🌏 Asien</option>
                <option value="africa">🌍 Afrika</option>
                <option value="northAmerica">🌎 Nordamerika</option>
                <option value="southAmerica">🌎 Südamerika</option>
                <option value="oceania">🏝️ Ozeanien</option>
            </select>
            <div class="learn-options" id="learnOptions" style="display:none;">
                <label class="learn-option">
                    <input type="checkbox" id="optShowMnemonic" checked> Merkhilfen anzeigen
                </label>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="panel action-panel">
        <button class="action-btn secondary" onclick="useHint()" id="hintBtn" disabled>💡 Tipp</button>
        <button class="action-btn secondary" onclick="skipQuestion()" id="skipBtn" disabled>⏭️ Skip</button>
        <button class="action-btn primary" onclick="startQuiz()" id="startBtn">🎯 Quiz</button>
        <button class="action-btn learn" onclick="startLearn()" id="learnBtn" style="display:none;">📚 Lernen</button>
    </div>

    <!-- Info Card -->
    <div class="info-card" id="infoCard">
        <div class="info-card-title" id="infoTitle">🌊 Rhein</div>
        <div class="info-card-subtitle" id="infoSubtitle">Fluss</div>
        <div class="info-card-facts" id="infoFacts"></div>
        <div class="info-mnemonic">
            <div class="info-mnemonic-title">💡 Merkhilfe</div>
            <div class="info-mnemonic-text" id="infoMnemonicText"></div>
        </div>
        <div class="info-card-nav">
            <button class="info-nav-prev" onclick="learnPrev()" aria-label="Vorheriges Element">←</button>
            <button class="info-nav-close" onclick="closeInfoCard()" aria-label="Schließen">OK ✓</button>
            <button class="info-nav-next" onclick="learnNext()" aria-label="Nächstes Element">→</button>
        </div>
    </div>

    <!-- Feedback -->
    <div class="feedback-toast" id="feedbackToast"></div>
    <div class="streak-badge" id="streakBadge">🔥 <span id="streakNum">0</span>x</div>

    <!-- Result Popup -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="result-popup">
            <h2>Quiz beendet!</h2>
            <div class="emoji" id="resEmoji">🎉</div>
            <div class="big-score" id="resScore">0%</div>
            <div class="msg" id="resMsg">Gut gemacht!</div>
            <div class="result-breakdown">
                <div class="bd-item"><div class="bd-val" id="resCorrect">0</div><div class="bd-lbl">Richtig</div></div>
                <div class="bd-item"><div class="bd-val" id="resWrong">0</div><div class="bd-lbl">Falsch</div></div>
                <div class="bd-item"><div class="bd-val" id="resPoints">0</div><div class="bd-lbl">Punkte</div></div>
            </div>
            <div class="weak-areas" id="weakAreas" style="display:none;">
                <div class="weak-title">📝 Wiederholen:</div>
                <div id="weakList"></div>
            </div>
            <button class="action-btn primary" onclick="closePopup()" style="width:100%; margin-top:12px;">🔄 Nochmal</button>
            <button class="action-btn learn" onclick="reviewWeak()" id="reviewBtn" style="width:100%; margin-top:6px; display:none;">📚 Üben</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
